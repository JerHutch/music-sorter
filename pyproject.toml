[project]
name = "music-sorter"
version = "0.1.0"
description = "Desktop application for organizing, tagging, and deduplicating MP3 collections"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    "librosa>=0.10",
    "musicbrainzngs>=0.7",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
]

[project.scripts]
music-sorter = "src.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
